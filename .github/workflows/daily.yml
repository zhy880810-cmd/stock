name: 每日雷达

on:
  schedule:
    # UTC 01:05 = 北京时间 09:05，周二到周六（对应美股周一到周五的收盘后）
    - cron: "5 1 * * 2-6"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点“Run workflow”

permissions:
  contents: write   # 需要把更新后的 data.json 提交回仓库

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 更新数据（行情 + 汇率 + AI 雷达）
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ secrets.XAI_MODEL || vars.XAI_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python scripts/update_daily.py

      - name: 提交 data.json
        run: |
          git config user.name "daily-radar-bot"
          git config user.email "daily-radar-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 没有变化，不用提交。"
            exit 0
          fi
          git commit -m "每日更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
